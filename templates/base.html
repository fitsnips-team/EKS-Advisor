<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EKS Advisor Dashboard{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        .metric-card {
            text-align: center;
            transition: transform 0.2s;
        }
        .metric-card:hover {
            transform: translateY(-5px);
        }
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
        }
        .metric-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .severity-critical { background-color: #dc3545; color: white; }
        .severity-high { background-color: #fd7e14; color: white; }
        .severity-medium { background-color: #ffc107; color: black; }
        .severity-low { background-color: #198754; color: white; }
        
        .footer {
            background-color: #212529;
            color: white;
            padding: 1rem 0;
            margin-top: 3rem;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        /* Enhanced cluster name styling */
        .cluster-name-badge {
            position: relative;
        }
        
        .cluster-name-badge .badge {
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 0.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.2);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        
        .cluster-info-highlight {
            border-left: 4px solid #0d6efd;
            transition: all 0.3s ease;
        }
        
        .cluster-info-highlight:hover {
            background-color: #e3f2fd !important;
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        
        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.2);
            }
            50% { 
                box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.2), 
                           0 0 1rem rgba(13, 110, 253, 0.3);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-kubernetes"></i>
                EKS Advisor
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/events">
                            <i class="bi bi-list-ul"></i> Events
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analysis">
                            <i class="bi bi-brain"></i> Analysis
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/history">
                            <i class="bi bi-graph-up"></i> History
                        </a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="navbar-text">
                            <i class="bi bi-shield-check"></i> Local Processing
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <div class="row">
                <div class="col">
                    <p class="mb-0">
                        <i class="bi bi-shield-lock"></i> 
                        EKS Advisor - Privacy-First Kubernetes Analysis
                    </p>
                    <small class="text-muted">
                        All AI processing done locally with Ollama • Zero external API calls
                    </small>
                </div>
            </div>
        </div>
    </footer>

    <!-- Refresh Button -->
    <button class="btn btn-primary refresh-btn" onclick="refreshData()" id="refreshBtn">
        <i class="bi bi-arrow-clockwise"></i>
    </button>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        // Auto-refresh every 5 minutes
        setInterval(function() {
            refreshData(false);
        }, 5 * 60 * 1000);
        
        async function refreshData(showFeedback = true) {
            const btn = document.getElementById('refreshBtn');
            const originalHtml = btn.innerHTML;
            
            if (showFeedback) {
                btn.innerHTML = '<i class="bi bi-arrow-clockwise spin"></i>';
                btn.disabled = true;
            }
            
            try {
                const response = await fetch('/api/refresh');
                const result = await response.json();
                
                if (response.ok) {
                    if (showFeedback) {
                        // Show success feedback
                        btn.innerHTML = '<i class="bi bi-check-circle"></i>';
                        setTimeout(() => {
                            location.reload();
                        }, 500);
                    }
                } else {
                    throw new Error(result.detail || 'Refresh failed');
                }
            } catch (error) {
                console.error('Refresh failed:', error);
                if (showFeedback) {
                    btn.innerHTML = '<i class="bi bi-exclamation-triangle"></i>';
                    btn.classList.add('btn-warning');
                    setTimeout(() => {
                        btn.innerHTML = originalHtml;
                        btn.classList.remove('btn-warning');
                        btn.disabled = false;
                    }, 2000);
                }
            }
        }
        
        // Add spinning animation for refresh
        const style = document.createElement('style');
        style.textContent = `
            .spin {
                animation: spin 1s linear infinite;
            }
            
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
